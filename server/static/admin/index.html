<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherryStudio 企业受管版 · 管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6f9; color: #1f2937; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .muted { color: #6b7280; font-size: 13px; }
  /* 登录 */
  #login-box { max-width: 380px; margin: 80px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  #login-box h2 { font-size: 18px; margin-bottom: 18px; text-align: center; }
  label { display: block; font-size: 13px; color: #374151; margin: 12px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #e5e7eb; color: #374151; }
  button.secondary:hover { background: #d1d5db; }
  #login-error { color: #dc2626; font-size: 13px; margin-top: 12px; min-height: 18px; }
  /* 主面板 */
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 16px 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { padding: 8px 14px; border-radius: 6px; cursor: pointer; background: #fff; border: 1px solid #e5e7eb; font-size: 13px; color: #374151; }
  .tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; font-size: 13px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #f0f0f0; }
  th { background: #f9fafb; color: #6b7280; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .badge.on { background: #dcfce7; color: #166534; }
  .badge.off { background: #fee2e2; color: #b91c1c; }
  .hidden { display: none; }
  .msg { font-size: 13px; margin-left: 12px; color: #6b7280; }
  pre { background: #1f2937; color: #e5e7eb; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  /* 推送Agent Tab */
  .push-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; }
  .card h3 { font-size: 14px; margin-bottom: 10px; }
  .pkg-row { padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .pkg-row.selected { border-color: #2563eb; background: #eff6ff; }
  .pkg-name { font-weight: 600; }
  .dev-list { max-height: 260px; overflow: auto; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px; }
  .dev-item { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 13px; }
  select, input[type=text] { padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .push-actions { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
  .result { margin-top: 12px; }
  .res-ok { background: #dcfce7; color: #166534; }
  .res-fail { background: #fee2e2; color: #b91c1c; }
  .remark-in { border: 1px solid transparent; background: transparent; padding: 2px 4px; font-size: 13px; width: 100%; border-radius: 4px; }
    .remark-in:hover, .remark-in:focus { border-color: #d1d5db; background: #fff; }
  .pkg-row button.del { border: none; background: transparent; cursor: pointer; font-size: 13px; color: #9ca3af; padding: 0 4px; }
  .pkg-row button.del:hover { color: #dc2626; }

</style>
</head>
<body>
  <div class="container">
    <!-- 登录视图 -->
    <div id="login-view">
      <div id="login-box">
        <h2>CherryStudio 管理后台</h2>
        <label>用户名</label>
        <input type="text" id="username" placeholder="admin">
        <label>密码</label>
        <input type="password" id="password" placeholder="••••••••">
        <div id="login-error"></div>
        <button id="login-btn" style="width:100%;margin-top:12px;">登录</button>
      </div>
    </div>

    <!-- 主面板视图 -->
    <div id="panel-view" class="hidden">
      <div class="toolbar">
        <div>
          <h1>CherryStudio 企业受管版</h1>
          <div class="muted">设备 / 派发 / 用量 / 审计 管理</div>
        </div>
        <div>
          <span class="msg" id="who"></span>
          <button class="secondary" id="logout-btn">退出</button>
        </div>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="devices">设备</div>
        <div class="tab" data-tab="dispatch">派发日志</div>
        <div class="tab" data-tab="usage">用量</div>
        <div class="tab" data-tab="audit">审计日志</div>
        <div class="tab" data-tab="agents">Agent 清单</div>
        <div class="tab" data-tab="packages">包配置</div>
        <div class="tab" data-tab="push">推送Agent</div>
        <div class="tab" data-tab="reconcile">对账</div>
      </div>

      <div id="content"><span class="muted">加载中…</span></div>
    </div>
  </div>

<script>
const TOKEN_KEY = 'CHERRY_ADMIN_TOKEN';
const TAB_KEY = 'CHERRY_ADMIN_ACTIVE_TAB';
let token = localStorage.getItem(TOKEN_KEY) || null;
let currentUser = localStorage.getItem('cherry_admin_user') || null;

const $ = (id) => document.getElementById(id);

function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['X-Admin-Token'] = token;
  return fetch(path, { ...opts, headers }).then(async (r) => {
    if (r.status === 401) { logoutUI('会话已过期，请重新登录'); throw new Error('unauthorized'); }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  });
}

// ---- 登录流程 ----
function showPanel() {
  $('login-view').classList.add('hidden');
  $('panel-view').classList.remove('hidden');
  $('who').textContent = '管理员: ' + currentUser;
  const saved = localStorage.getItem(TAB_KEY) || 'devices';
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === saved));
  loadTab(saved);
}

function logoutUI(msg) {
  token = null; currentUser = null;
  localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('cherry_admin_user');
  $('panel-view').classList.add('hidden');
  $('login-view').classList.remove('hidden');
  $('password').value = '';
  $('login-error').textContent = msg || '';
}

$('login-btn').addEventListener('click', async () => {
  const username = $('username').value.trim();
  const password = $('password').value;
  $('login-error').textContent = '';
  try {
    const data = await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });
    token = data.token; currentUser = data.user;
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem('cherry_admin_user', currentUser);
    showPanel();
  } catch (e) {
    $('login-error').textContent = e.message === 'unauthorized' ? '用户名或密码错误' : '登录失败';
  }
});
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('login-btn').click(); });

$('logout-btn').addEventListener('click', async () => {
  try { await api('/api/admin/logout', { method: 'POST' }); } catch (e) {}
  logoutUI();
});

// ---- Tab 切换 ----
document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
    tab.classList.add('active');
    localStorage.setItem(TAB_KEY, tab.dataset.tab);
    loadTab(tab.dataset.tab);
  });
});

// 兼容后端两种返回：{ total,limit,offset,items:[...] } 包装 与 裸数组（问题2修复）
function apiList(res) { return Array.isArray(res) ? res : ((res && res.items) || []); }

// 问题3：设备显示 —— 有备注显示备注，无备注显示 device_id；设备列含 IP
function displayDevice(r) {
  const label = (r.remark && String(r.remark).trim()) ? r.remark : r.device_id;
  return '<span title="' + esc(r.device_id) + '">' + esc(label) + '</span>';
}

function remarkCell(r) {
  const v = r.remark || '';
  return '<input class="remark-in" data-dev="' + esc(r.device_id) + '" value="' + esc(v) + '" placeholder="添加备注" onchange="saveRemark(this)">';
}

async function saveRemark(input) {
  const dev = input.dataset.dev;
  const val = input.value.trim();
  try {
    await api('/api/admin/devices/' + encodeURIComponent(dev) + '/remark', {
      method: 'PUT', body: JSON.stringify({ remark: val })
    });
  } catch (e) { alert('保存备注失败: ' + (e.message || e)); }
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderTable(rows, cols) {
  if (!rows || !rows.length) return '<span class="muted">无数据</span>';
  let html = '<table><thead><tr>';
  cols.forEach((c) => { html += '<th>' + esc(c.label) + '</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach((r) => {
    html += '<tr>';
    cols.forEach((c) => {
      const raw = c.key.startsWith('!');
      const v = raw
        ? (c.fn ? c.fn(r) : r[c.key.slice(1)])
        : r[c.key];
      html += '<td>' + (raw ? v : esc(v)) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

// ---- 推送Agent Tab（JJC-20260819-001 方案B）----
let pushState = { pkg: null, rev: null };

function pushCard(label, inner) {
  return '<div class="card"><h3>' + label + '</h3>' + inner + '</div>';
}

async function loadPush() {
  const packs = (await api('/api/admin/agent-configs')).data || [];
  const devs = (await api('/api/admin/devices')).items || [];
  let pkgHtml = '<div>';
  if (!packs.length) {
    pkgHtml += '<span class="muted">尚无 Agent 配置包。先创建配置包再推送。</span>';
  } else {
    packs.forEach((p) => {
      const selCls = pushState.pkg && p.name === pushState.pkg ? ' selected' : '';
      pkgHtml += '<div class="pkg-row' + selCls + '" data-name="' + esc(p.name) +
        '" onclick="selectPushPkg(this)"><span class="pkg-name">' + esc(p.name) +
        '</span><span class="muted">rev' + esc(p.latest_rev) + ' v' + esc(p.version) +
        (p.locked ? ' 🔒' : '') + '</span></div>';
    });
  }
  pkgHtml += '</div>';

  let revOpts = ['<option value="">' + (pushState.rev ? 'rev' + pushState.rev : '— 选择包 —') + '</option>'];
  if (pushState.pkg) {
    const ver = (await api('/api/admin/agent-configs/' + encodeURIComponent(pushState.pkg) + '/versions')).data || [];
    ver.forEach((v) => {
      revOpts.push('<option value="' + v.rev + '"' + (pushState.rev === v.rev ? ' selected' : '') +
        '>rev' + v.rev + ' · v' + esc(v.version) + '</option>');
    });
  }

  let devHtml = '<div class="dev-list">';
  if (!devs.length) {
    devHtml += '<span class="muted">无在线/已注册设备</span>';
  } else {
    devs.forEach((d) => {
      devHtml += '<label class="dev-item"><input type="checkbox" class="dev-chk" value="' +
        esc(d.device_id) + '">' + esc(d.device_id) + ' <span class="muted">' + esc(d.hostname) +
        (d.online ? ' · 在线' : ' · 离线') + ' · ' + esc(d.group || '') + '</span></label>';
    });
  }
  devHtml += '</div>';

  const left = pushCard('① Agent 配置包（选一个查看版本）', pkgHtml) +
    pushCard('② 目标版本（默认最新；历史 rev 即回滚）',
      '<select id="rev-select" onchange="pushState.rev=parseInt(this.value)||null">' + revOpts.join('') + '</select>' +
      '<div class="muted">锁定 🔒 的包禁止推送；选历史 rev 推送 = 回滚（仅覆盖 agent 主体）</div>');
  const right = pushCard('③ 推送目标设备（勾选）', devHtml) +
    pushCard('④ 推送',
      '<div class="push-actions">' +
      '<label class="muted"><input type="checkbox" id="if-changed" checked> 仅推变更设备</label>' +
      '<button onclick="doPush()">推送</button>' +
      '<button class="secondary" onclick="pushState={pkg:null,rev:null};loadTab(\'push\')">重置</button>' +
      '</div><div class="result" id="push-result"></div>');
  return '<div class="push-grid">' + left + right + '</div>';
}

function selectPushPkg(el) {
  pushState.pkg = el.dataset.name;
  pushState.rev = null;
  loadTab('push');
}

async function doPush() {
  const box = $('push-result');
  if (!pushState.pkg) { box.innerHTML = '<div class="res-fail">请先选择配置包</div>'; return; }
  const devs = Array.from(document.querySelectorAll('.dev-chk:checked')).map((c) => c.value);
  if (!devs.length) { box.innerHTML = '<div class="res-fail">请勾选至少一台目标设备</div>'; return; }
  const body = {
    agent_name: pushState.pkg,
    devices: devs,
    target_rev: pushState.rev || undefined,
    if_changed: !!$('if-changed').checked,
    reason: 'admin UI push'
  };
  box.innerHTML = '<span class="muted">推送中…</span>';
  try {
    const r = await api('/api/admin/push/agents', { method: 'POST', body: JSON.stringify(body) });
    const d = r.data;
    box.innerHTML = '<div class="res-ok">已推送 ' + esc(d.agent_name) + ' @rev' + esc(d.target_rev) +
      ' → ' + (d.request_ids || []).length + ' 台设备（在线' + d.dispatch.online_sent +
      ' / 离线' + d.dispatch.offline_queued + ' / 跳过' + d.dispatch.skipped_unchanged + '）</div>' +
      '<pre>' + esc(JSON.stringify(d.request_ids, null, 2)) + '</pre>';
    pollPushJobs(d.request_ids || []);
  } catch (e) {
    box.innerHTML = '<div class="res-fail">推送失败: ' + esc(e.message || e) + '</div>';
  }
}

// ================= 包配置管理（新建/编辑/版本/回滚） =================
let pkgState = { editing: null, mode: 'form' };

function pkgCard(label, inner) {
  return '<div class="card"><h3>' + label + '</h3>' + inner + '</div>';
}

// 新建视图：右侧显示空表单
async function loadPackages() {
  const packs = ((await api('/api/admin/agent-configs')).data) || [];
  // 列表
  let listHtml = '<div>';
  if (!packs.length) {
    listHtml += '<span class="muted">尚无 Agent 配置包。在右侧新建第一个包。</span>';
  } else {
    packs.forEach((p) => {
      const sel = pkgState.editing && p.name === pkgState.editing ? ' selected' : '';
      listHtml += '<div class="pkg-row' + sel + '" data-name="' + esc(p.name) + '" onclick="selectPkg(this)">' +
        '<span class="pkg-name">' + esc(p.name) + '</span>' +
        '<span class="muted">rev' + esc(p.latest_rev) + ' · v' + esc(p.version) +
        (p.locked ? ' 🔒' : '') + '</span>' +
        '<button class="del-pkg" data-name="' + esc(p.name) + '" title="删除该配置包" onclick="event.stopPropagation();delPkg(\'' + esc(p.name) + '\')">🗑</button></div>';
    });
  }
  listHtml += '</div>';

  // 右侧：编辑区（新建 or 编辑已有）
  let editorHtml = '';
  if (pkgState.editing) {
    const detail = (await api('/api/admin/agent-configs/' + encodeURIComponent(pkgState.editing))).data || {};
    const latest = detail.version || {};
    const agent = latest.agent || {};
    const meta = latest.metadata || {};
    const cfgTxt = JSON.stringify(agent.configuration || {}, null, 2);
    editorHtml = pkgCard('编辑配置包：' + esc(pkgState.editing),
      '<div class="push-actions"><button class="secondary" onclick="pkgState={editing:null,mode:\'form\'};loadTab(\'packages\')">新建</button>' +
      '<button class="secondary" onclick="loadPkgVersions()">刷新版本</button></div>' +
      pkgForm(meta, agent, cfgTxt) +
      '<div class="push-actions"><button onclick="savePkg()">保存为新版本(rev+1)</button>' +
      '<button class="secondary" onclick="loadPkgVersions()">版本历史</button></div>');
  } else {
    editorHtml = pkgCard('新建配置包',
      pkgForm({ name: '', version: '1.0.0' }, { name: '', type: 'claude-code', model: '', description: '', instructions: '' }, '') +
      '<div class="push-actions"><button onclick="savePkg()">创建(rev=1)</button></div>');
  }

  const left = '<div>' + pkgCard('① 配置包列表', listHtml) + '<div id="pkg-versions"></div>' + '</div>';
  const right = '<div>' + editorHtml + '</div>';
  return '<div class="push-grid">' + left + right + '</div>';
}

// 修正版 pkgForm：避免 verTxt 嵌套错误
function pkgForm(meta, agent, cfgTxt) {
  return '<label>名称 (metadata.name, 稳定主键)</label>' +
    '<input type="text" id="pkg-name" value="' + esc(meta.name || '') + '" ' + (pkgState.editing ? 'disabled' : '') + '>' +
    '<label>版本 (语义化 x.y.z)</label>' +
    '<input type="text" id="pkg-version" value="' + esc(meta.version || '1.0.0') + '">' +
    '<label>Agent name（员工机显示名）</label>' +
    '<input type="text" id="pkg-agent-name" value="' + esc((agent && agent.name) || '') + '">' +
    '<label>type</label>' +
    '<input type="text" id="pkg-type" value="' + esc((agent && agent.type) || 'claude-code') + '">' +
    '<label>model（如 cherryai::qwen2.5-coder）</label>' +
    '<input type="text" id="pkg-model" value="' + esc((agent && agent.model) || '') + '" placeholder="必填">' +
    '<label>description（可选）</label>' +
    '<input type="text" id="pkg-desc" value="' + esc((agent && agent.description) || '') + '">' +
    '<label>instructions（系统提示词 / prompt）</label>' +
    '<textarea id="pkg-instructions" rows="6" placeholder="粘贴你调试好的完整 instructions">' + esc((agent && agent.instructions) || '') + '</textarea>' +
    '<label>configuration（JSON，可选）</label>' +
    '<textarea id="pkg-cfg" rows="4" placeholder=\'{"permission_mode":"default","max_turns":50}\'>' + (cfgTxt || '') + '</textarea>' +
    '<div class="muted">新建走 POST（服务端自动生成 id）；更新走 PUT（必须带原 id，自动 rev+1）</div>';
}

function verTxt(v) { return v || ''; }

async function selectPkg(el) {
  pkgState.editing = el.dataset.name;
  loadTab('packages');
}

async function loadPkgVersions() {
  const box = $('pkg-versions');
  if (!pkgState.editing) { box.innerHTML = ''; return; }
  const ver = ((await api('/api/admin/agent-configs/' + encodeURIComponent(pkgState.editing) + '/versions')).data) || [];
  box.innerHTML = pkgCard('② 版本历史（点版本→回滚）', ver.length ?
    ver.map((v) => '<div class="pkg-row" onclick="rollbackPkg(\'' + esc(v.rev) + '\')">' +
      '<span>rev' + esc(v.rev) + ' · v' + esc(v.version) + '</span>' +
      '<span class="muted">' + esc(v.created_at || '') + '</span></div>').join('') :
    '<span class="muted">无版本</span>');
}

async function rollbackPkg(rev) {
  if (!confirm('确认回滚 ' + pkgState.editing + ' 到 rev' + rev + '？将推送到已部署设备')) return;
  try {
    const r = await api('/api/admin/agent-configs/' + encodeURIComponent(pkgState.editing) + '/rollback-to/' + rev, {
      method: 'POST', body: JSON.stringify({ reason: 'admin UI rollback' })
    });
    alert('回滚发起: ' + JSON.stringify(r.data && r.data.dispatch));
    loadPkgVersions();
  } catch (e) { alert('回滚失败: ' + (e.message || e)); }
}

async function delPkg(name) {
  if (!confirm('确认删除配置包「' + name + '」？其全部版本历史与设备部署状态将一并删除。')) return;
  try {
    await api('/api/admin/agent-configs/' + encodeURIComponent(name), { method: 'DELETE' });
    if (pkgState.editing === name) pkgState = { editing: null, mode: 'form' };
    alert('已删除'); loadTab('packages');
  } catch (e) {
    const msg = (e && e.message) || e;
    alert('删除失败: ' + msg + (msg.indexOf('锁定') >= 0 ? '（锁定中的包需先解锁）' : ''));
  }
}

async function savePkg() {
  const name = $('pkg-name') ? $('pkg-name').value.trim() : '';
  const version = $('pkg-version') ? $('pkg-version').value.trim() || '1.0.0' : '1.0.0';
  const aname = $('pkg-agent-name') ? $('pkg-agent-name').value.trim() : '';
  const ttype = $('pkg-type') ? $('pkg-type').value.trim() || 'claude-code' : 'claude-code';
  const model = $('pkg-model') ? $('pkg-model').value.trim() : '';
  const desc = $('pkg-desc') ? $('pkg-desc').value.trim() : '';
  const instr = $('pkg-instructions') ? $('pkg-instructions').value : '';
  let cfg = {};
  const cfgTxt = $('pkg-cfg') ? $('pkg-cfg').value.trim() : '';
  if (cfgTxt) {
    try { cfg = JSON.parse(cfgTxt); } catch (e) { alert('configuration JSON 格式错误: ' + e.message); return; }
  }
  if (!name || !aname || !model || !instr) {
    alert('必填: 名称 / Agent名 / model / instructions'); return;
  }
  const pkg = {
    metadata: { name, version },
    agent: { name: aname, type: ttype, model, description: desc, instructions: instr, configuration: cfg }
  };
  const isEdit = !!pkgState.editing;
  const url = isEdit ? '/api/admin/agent-configs/' + encodeURIComponent(pkgState.editing) : '/api/admin/agent-configs';
  try {
    const body = Object.assign({}, pkg);
    if (isEdit) {
      // 编辑时：确保带稳定 id（从服务端最新配置里拿）
      const cur = ((await api('/api/admin/agent-configs/' + encodeURIComponent(pkgState.editing))).data || {});
      const curAgent = (cur && cur.version && cur.version.agent) || {};
      body.agent.id = curAgent.id;
    }
    const r = await api(url, { method: isEdit ? 'PUT' : 'POST', body: JSON.stringify(body) });
    alert(isEdit ? '已更新为 rev' + r.data.rev : '已创建 rev1');
    pkgState = { editing: isEdit ? pkgState.editing : null, mode: 'form' };
    loadTab('packages');
  } catch (e) {
    let msg = e.message || e;
    alert('保存失败: ' + msg);
  }
}

let pollTimer = null;
function pollPushJobs(rids) {
  if (pollTimer) clearInterval(pollTimer);
  let tries = 0;
  pollTimer = setInterval(async () => {
    tries++;
    try {
      const rows = (await api('/api/admin/push/jobs')).data || [];
      const hits = rows.filter((r) => rids.indexOf(r.request_id) >= 0);
      const box = $('push-result');
      if (hits.length) {
        box.innerHTML += '<table><thead><tr><th>request_id</th><th>设备</th><th>状态</th></tr></thead><tbody>' +
          hits.map((h) => '<tr><td>' + esc(h.request_id) + '</td><td>' + esc(h.device_id) +
            '</td><td class="' + (h.status === 'success' ? 'res-ok' : (h.status === 'fail' ? 'res-fail' : '')) +
            '">' + esc(h.status) + '</td></tr>').join('') + '</tbody></table>';
      }
      const allDone = hits.length && hits.every((h) => h.status === 'success' || h.status === 'fail');
      if (allDone || tries > 40) { clearInterval(pollTimer); pollTimer = null; }
    } catch (e) { /* 轮询失败静默，下次重试 */ }
  }, 3000);
}

async function loadTab(tab) {
  const c = $('content');
  c.innerHTML = '<span class="muted">加载中…</span>';
  try {
    if (tab === 'devices') {
      const res = await api('/api/admin/devices');
      const rows = apiList(res);
      c.innerHTML = renderTable(rows, [
        { key: '!device_label', label: '设备', fn: (r) => displayDevice(r) },
        { key: 'device_id', label: '设备ID' },
        { key: 'ip', label: '内网IP' },
        { key: 'hostname', label: '主机名' },
        { key: 'os', label: '系统' },
        { key: 'group', label: '分组' },
        { key: 'online', label: '状态', fn: (v) => (v ? '在线' : '离线') },
        { key: '!remark', label: '备注', fn: (r) => remarkCell(r) },
        { key: 'last_seen', label: '最近在线' }
      ]);
    } else if (tab === 'dispatch') {
      const rows = apiList(await api('/api/admin/dispatch_log'));
      c.innerHTML = renderTable(rows, [
        { key: 'request_id', label: '请求ID' },
        { key: '!device_label', label: '设备', fn: (r) => displayDevice(r) },
        { key: 'ip', label: '内网IP' },
        { key: 'type', label: '类型' },
        { key: 'action', label: '动作' },
        { key: 'status', label: '状态' },
        { key: 'created_at', label: '创建时间' }
      ]);
    } else if (tab === 'usage') {
      const rows = apiList(await api('/api/admin/usage'));
      c.innerHTML = renderTable(rows, [
        { key: '!device_label', label: '设备', fn: (r) => displayDevice(r) },
        { key: 'provider', label: 'Provider' },
        { key: 'model', label: '模型' },
        { key: 'input_tokens', label: '输入 tokens' },
        { key: 'output_tokens', label: '输出 tokens' },
        { key: 'total_tokens', label: '合计 tokens' },
        { key: 'period', label: '周期' }
      ]);
    } else if (tab === 'audit') {
      const rows = apiList(await api('/api/admin/audit_log'));
      c.innerHTML = renderTable(rows, [
        { key: 'id', label: 'ID' },
        { key: 'operator', label: '操作者' },
        { key: 'action', label: '动作' },
        { key: 'target', label: '目标' },
        { key: 'timestamp', label: '时间' },
        { key: 'request_id', label: '请求ID' }
      ]);
    } else if (tab === 'agents') {
      const rows = apiList(await api('/api/admin/agents'));
      c.innerHTML = renderTable(rows, [
        { key: '!device_label', label: '设备', fn: (r) => displayDevice(r) },
        { key: 'agent_id', label: 'Agent' },
        { key: 'file_count', label: '文件数' },
        { key: 'ip', label: '内网IP' }
      ]);
    } else if (tab === 'packages') {
      c.innerHTML = await loadPackages();
    } else if (tab === 'push') {
      c.innerHTML = await loadPush();
    } else if (tab === 'reconcile') {
      const data = await api('/api/admin/reconcile');
      c.innerHTML = '<pre>' + esc(JSON.stringify(data, null, 2)) + '</pre>';
    }
  } catch (e) {
    if (e.message !== 'unauthorized') c.innerHTML = '<span class="muted">加载失败</span>';
  }
}

// 启动：已有 token 直接进面板
if (token) { showPanel(); }
